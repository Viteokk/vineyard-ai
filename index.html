<style>
:root{
  --bg:#E9ECE8; --panel:rgba(255,255,255,.86); --solid:#FFFFFF; --ink:#101713; --muted:#5A655F; --faint:#7D8781;
  --line:rgba(16,23,19,.10); --hover:rgba(16,23,19,.05); --press:rgba(16,23,19,.09);
  --accent:#1D7A4B; --on-accent:#FFFFFF; --accent-soft:rgba(29,122,75,.12); --accent-ink:#17603B;
  --route:#F2561D; --warn:#D92D20; --warn-soft:rgba(217,45,32,.10);
  --shadow:0 1px 1px rgba(16,23,19,.04),0 6px 16px rgba(16,23,19,.08),0 18px 40px rgba(16,23,19,.08);
  --mapbg:#1C221E; --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0A0E0C; --panel:rgba(17,22,19,.84); --solid:#131915; --ink:#EDF2EE; --muted:#9BA69F; --faint:#76807A;
  --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09);
  --accent:#4ADE80; --on-accent:#052312; --accent-soft:rgba(74,222,128,.14); --accent-ink:#86EFAC;
  --route:#FF6B35; --warn:#F97066; --warn-soft:rgba(249,112,102,.14);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35),0 24px 48px rgba(0,0,0,.3); --mapbg:#0E1210;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0A0E0C; --panel:rgba(17,22,19,.84); --solid:#131915; --ink:#EDF2EE; --muted:#9BA69F; --faint:#76807A;
  --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09);
  --accent:#4ADE80; --on-accent:#052312; --accent-soft:rgba(74,222,128,.14); --accent-ink:#86EFAC;
  --route:#FF6B35; --warn:#F97066; --warn-soft:rgba(249,112,102,.14);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35),0 24px 48px rgba(0,0,0,.3); --mapbg:#0E1210;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--hover);color:var(--muted)}

#map{position:fixed;inset:0;background:var(--mapbg)}
.leaflet-container{background:var(--mapbg);font:inherit;outline:0}
.leaflet-image-layer.ortho{image-rendering:auto}
.start-ic{display:flex;align-items:center;gap:6px;white-space:nowrap}
.start-ic i{width:18px;height:18px;border-radius:50%;background:#101713;box-shadow:0 0 0 4px #fff;flex-shrink:0}
.start-ic span{font:700 11px/1 'Geist',sans-serif;letter-spacing:.06em;color:#fff;background:#101713;padding:4px 7px;border-radius:6px}

/* chrome */
.rail{position:fixed;left:16px;top:16px;bottom:16px;width:60px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:1000}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:8px}
.rail a{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);text-decoration:none}
.rail a:hover{background:var(--hover);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.rail .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s}
.rail a:hover .tip,.rail a:focus-visible .tip{opacity:1}
.rail .sp{flex-grow:1}
.rail button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.rail button:hover{background:var(--hover);color:var(--ink)}
.panel{position:fixed;left:88px;top:16px;bottom:16px;width:392px;border-radius:20px;z-index:999;display:flex;flex-direction:column;overflow:hidden;transition:width .28s cubic-bezier(.2,.8,.2,1),transform .28s cubic-bezier(.2,.8,.2,1)}
.panel.wide{width:min(760px,calc(100vw - 120px))}
.panel.collapsed{transform:translateX(calc(-100% - 100px))}
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.p-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.p-head h1{font-size:20px;margin-top:3px}
.p-body{flex-grow:1;overflow:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:22px}
.p-body > *{flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-title h2{font-size:13px;font-weight:600}
.sec-title span{font-size:12px;color:var(--muted)}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--hover);gap:2px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);padding:0 10px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.stat:nth-child(-n+2){border-top:0}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat .v{font-size:20px;font-weight:600;letter-spacing:-.02em}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.stat .l{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.callout{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--hover)}
.callout b{font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 8px;margin:0 -8px;border-radius:10px;text-align:left;width:calc(100% + 16px)}
.li:hover{background:var(--hover)}
.li.sel{background:var(--accent-soft)}
.li b{font-weight:600}
.li .r{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.mini{height:6px;border-radius:3px;background:var(--accent);opacity:.8;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--accent)}
.dot.dis{background:var(--warn)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.badge.dis{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--solid);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.search{width:100%;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--solid);padding:0 12px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;top:0;background:var(--solid)}
td{padding:8px 10px;border-top:1px solid var(--line);font-size:13px;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:320px;background:var(--solid)}
.chart text{font-family:'Geist',sans-serif;font-size:11px;fill:var(--muted)}
.chart .lbl{fill:var(--ink)}
.chart .grid{stroke:var(--line)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:14px;top:40px;bottom:-6px;width:2px;background:var(--line)}
.step .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--line);background:var(--solid);color:var(--muted)}
.step.done .ic{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.wip .ic{border-color:var(--route);color:var(--route)}
.step b{display:block;font-weight:600}
.step small{color:var(--muted);font-size:12px}
.step .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:6px}
.code{position:relative;background:#0B100D;color:#D4E2D8;border-radius:14px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.75;white-space:pre;overflow-x:auto}
.code .c{color:#6D8575}
.code .copy{position:absolute;right:8px;top:8px;height:28px;padding:0 10px;border-radius:8px;border:1px solid #243129;background:#131B16;color:#D4E2D8;font-size:12px;font-weight:600}
.facts{display:grid;grid-template-columns:130px 1fr;font-size:13px}
.facts div{padding:9px 0;border-top:1px solid var(--line)}
.facts div:nth-child(odd){color:var(--muted)}

.cmd{position:fixed;left:calc(50% + 240px);top:16px;transform:translateX(-50%);width:min(420px,calc(100vw - 620px));min-width:260px;height:44px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;z-index:1000;color:var(--muted);text-align:left}
.cmd:hover{color:var(--ink)}
.cmd .grow{flex-grow:1}
.panel.collapsed ~ .cmd{left:50%}
.panel.wide:not(.collapsed) ~ .cmd{display:none}
.tr{position:fixed;right:16px;top:16px;display:flex;gap:8px;z-index:1000}
.tr .icon-btn{width:44px;height:44px;border-radius:14px}
.tr .btn{min-height:44px;border-radius:14px}
.pop{position:fixed;right:16px;top:70px;width:290px;border-radius:18px;padding:14px;z-index:1001;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
.sw{display:flex;align-items:center;gap:10px;min-height:38px;font-size:13px;padding:0 4px;border-radius:10px;width:100%;text-align:left}
.sw:hover{background:var(--hover)}
.sw .sw-i{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.sw .tg{margin-left:auto;width:32px;height:20px;border-radius:999px;background:var(--press);position:relative;transition:background .15s;flex-shrink:0}
.sw .tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"] .tg{background:var(--accent)}
.sw[aria-checked="true"] .tg::after{transform:translateX(12px)}
.pop label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding:10px 4px 2px;border-top:1px solid var(--line);margin-top:6px}
input[type=range]{accent-color:var(--accent);width:100%}
.insp{position:fixed;right:16px;top:70px;width:300px;border-radius:18px;padding:16px;z-index:1000;display:flex;flex-direction:column;gap:12px}
.insp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.insp dt{color:var(--muted)}
.insp dd{margin:0;font-weight:600;text-align:right;word-break:break-all}
.insp .acts{display:flex;gap:8px}
.insp .acts .btn{flex:1;min-height:36px;font-size:13px;padding:0 10px}
.zoom{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;border-radius:14px;z-index:1000;overflow:hidden}
.zoom button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.zoom button:hover{background:var(--hover)}
.zoom button+button{border-top:1px solid var(--line)}
.readout{position:fixed;right:72px;bottom:16px;height:44px;border-radius:14px;display:flex;align-items:center;gap:14px;padding:0 14px;z-index:1000;font-size:12px;color:var(--muted)}
.readout .sb{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.readout .sb i{display:block;height:4px;background:var(--ink);border-radius:2px}
.loader{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:var(--bg)}
.loader div{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:420px;padding:0 16px;text-align:center}
.bar{width:220px;height:4px;border-radius:2px;background:var(--hover);overflow:hidden}
.bar span{display:block;height:100%;width:30%;background:var(--accent);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.veil{position:fixed;inset:0;z-index:1500;background:rgba(6,10,8,.35);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.palette{width:min(600px,100%);border-radius:20px;overflow:hidden;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.palette input{width:100%;height:56px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 20px;font-size:16px;outline:none}
.pal-list{max-height:360px;overflow:auto;padding:8px}
.pal-g{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.pal-i{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:10px;text-align:left}
.pal-i .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--hover);color:var(--muted);font-size:11px;font-weight:700;flex-shrink:0}
.pal-i .r{margin-left:auto;font-size:12px;color:var(--muted)}
.pal-i.act{background:var(--accent-soft)}
.pal-foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.modal{width:min(720px,100%);border-radius:20px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:80vh}
.modal textarea{width:100%;flex-grow:1;min-height:300px;border-radius:12px;border:1px solid var(--line);background:var(--hover);font-family:var(--mono);font-size:12px;padding:12px;resize:vertical;color:var(--ink)}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:3000;background:var(--ink);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow)}
@media (max-width:1100px){.cmd{display:none}}
@media (max-width:820px){
  .rail{left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;height:60px;flex-direction:row;justify-content:space-around;padding:0 8px}
  .rail .logo,.rail .sp,.rail .tip{display:none}
  .panel,.panel.wide{left:12px;right:12px;width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:44vh}
  .panel.collapsed{transform:translateY(calc(100% + 100px))}
  .tr{right:12px;top:12px}.tr .btn{display:none}
  .pop,.insp{right:12px;left:12px;width:auto;top:66px}
  .zoom,.readout{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(async () => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fmt = (n, d = 0) => (+n).toLocaleString('ro-RO', {minimumFractionDigits: d, maximumFractionDigits: d});
const store = {get(k, f) { try { const v = localStorage.getItem('fpm.' + k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } },
               set(k, v) { try { localStorage.setItem('fpm.' + k, JSON.stringify(v)); } catch (e) {} }};
const phone = () => innerWidth <= 820;
const kmT = m => m >= 1000 ? `${fmt(m / 1000, 2)} km` : `${fmt(m, 1)} m`;
const kmH = m => m >= 1000 ? `${fmt(m / 1000, 2)}<small>km</small>` : `${fmt(m, 0)}<small>m</small>`;
const haH = m2 => `${fmt(m2 / 1e4, 2)}<small>ha</small>`;
const short = n => n.replace('siret3_', '').replace('.tif', '');
async function j(url, optional) {
  try { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return await r.json(); }
  catch (e) { if (optional) return null; throw new Error(url); }
}
const IC = {
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  collapse: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  sun: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>',
  auto: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></svg>'
};

/* ============ load data ============ */
let IDX, EXTRA = {}, SRC = {};
try {
  if (!window.L) throw new Error('leaflet');
  IDX = await j('data/mosaic_index.json', true);
  if (!IDX) { const t = await j('data/tiles_index.json'); IDX = {chunks: t, hires: [], tiles: t}; }
  const [study, passages, forbidden, start, route, targets] = await Promise.all(['study_area', 'passages', 'forbidden', 'start', 'route', 'targets'].map(n => j(`data/${n}.geojson`, true)));
  EXTRA = {study, passages, forbidden, start, route, targets, check: await j('data/route_check.json', true)};
  const [pSum, pRows, pInter, pCan, rSum, rRows, rInter, rCan] = await Promise.all([
    j('data/pred/summary.json', true), j('data/pred/rows.geojson', true), j('data/pred/interrows.geojson', true), j('data/pred/canopies.json', true),
    j('data/summary.json', true), j('data/rows.geojson', true), j('data/interrows.geojson', true), j('data/canopies.geojson', true)]);
  if (pSum) SRC.pred = {name: 'Pre-adnotări AI', sub: 'detector v1, necorectat', sum: pSum, rows: pRows, inter: pInter, can: pCan};
  if (rSum) SRC.ref = {name: 'Referință oficială', sub: '2 tile-uri adnotate de organizatori', sum: rSum, rows: rRows, inter: rInter, can: rCan};
} catch (e) {
  $('#loader').innerHTML = `<div><b style="font-size:16px">Harta nu s-a putut încărca</b><p class="note">${e.message === 'leaflet' ? 'Biblioteca de hărți nu s-a descărcat. Verifică conexiunea la internet.' : `Lipsește <span class="mono">${e.message}</span>. Deschide site-ul printr-un server local, nu direct din fișier:`}</p><div class="code" style="text-align:left">python -m http.server -d web 8000\n# apoi: http://localhost:8000</div></div>`;
  return;
}
const TILES = IDX.tiles || IDX.chunks;
const TB = Object.fromEntries(TILES.map(t => [t.name || t.img, t.bounds]));
const all = TILES.map(t => t.bounds);
const EXT = [Math.min(...all.map(b => b[0])), Math.min(...all.map(b => b[1])), Math.max(...all.map(b => b[2])), Math.max(...all.map(b => b[3]))];

/* ============ per-tile indexes of annotation features ============ */
function indexSource(s) {
  const by = {};
  const get = t => by[t] ||= {rows: [], inter: [], can: [], rowLen: 0};
  for (const f of s.rows?.features || []) { const g = get(f.properties.tile); g.rows.push(f); g.rowLen += f.properties.length_m || 0; }
  for (const f of s.inter?.features || []) get(f.properties.tile).inter.push(f);
  if (s.can?.tiles) {           // compact: delta-encoded integer centimetres
    const {x0, y0} = s.can;
    for (const [t, polys] of Object.entries(s.can.tiles)) get(t).can = polys.map(fl => { const pts = []; let x = 0, y = 0; for (let i = 0; i < fl.length; i += 2) { x += fl[i]; y += fl[i + 1]; pts.push([x0 + x / 100, y0 + y / 100]); } return pts; });
  } else for (const f of s.can?.features || []) { const c = f.geometry.type === 'Polygon' ? f.geometry.coordinates[0] : f.geometry.coordinates[0][0]; get(f.properties.tile).can.push(c); }
  s.by = by; s.tiles = Object.keys(by).sort((a, b) => by[b].can.length - by[a].can.length);
}
Object.values(SRC).forEach(indexSource);

/* ============ state ============ */
const S = {
  view: 'harta', src: store.get('src', SRC.pred ? 'pred' : 'ref'), sel: null, q: '', collapsed: false,
  layers: Object.assign({ortho: true, canopy: true, rows: true, inter: true, passage: true, forbidden: true, study: true, grid: false, route: true, targets: true}, store.get('layers', {})),
  op: store.get('op', 1)
};
if (!SRC[S.src]) S.src = Object.keys(SRC)[0];
const cur = () => SRC[S.src];

/* ============ map ============ */
const CRS = L.extend({}, L.CRS.Simple, {transformation: new L.Transformation(1, -EXT[0], -1, EXT[3])});
const ll = (x, y) => L.latLng(y, x);
const bnds = b => L.latLngBounds(ll(b[0], b[1]), ll(b[2], b[3]));
const map = L.map('map', {crs: CRS, zoomControl: false, attributionControl: false, minZoom: -3, maxZoom: 6.5, zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 100, preferCanvas: true, maxBounds: bnds([EXT[0] - 400, EXT[1] - 400, EXT[2] + 400, EXT[3] + 400])});
const R = L.canvas({padding: 0.4, tolerance: 5});
const ortho = L.layerGroup(IDX.chunks.map(c => L.imageOverlay(c.img, bnds(c.bounds), {className: 'ortho', opacity: S.op}))).addTo(map);
const hires = L.layerGroup((IDX.hires || []).map(h => L.imageOverlay(h.img, bnds(h.bounds), {className: 'ortho', opacity: S.op})));
const HIRES_Z = 3.5;
const toLL = c => L.latLng(c[1], c[0]);
const geo = (fc, style, extra = {}) => fc ? L.geoJSON(fc, {renderer: R, coordsToLatLng: toLL, style, interactive: false, ...extra}) : L.layerGroup();
const ctx = {
  study: geo(EXTRA.study, {color: '#FFFFFF', weight: 2, dashArray: '8 6', fill: false, opacity: .9}),
  passage: geo(EXTRA.passages, {color: '#FFFFFF', weight: 1.2, fillColor: '#FFFFFF', fillOpacity: .22, opacity: .9}),
  forbidden: geo(EXTRA.forbidden, {color: '#FF6B6B', weight: 1.4, dashArray: '6 4', fillColor: '#FF4D4D', fillOpacity: .07}),
  grid: L.layerGroup(TILES.filter(t => t.name).map(t => L.rectangle(bnds(t.bounds), {renderer: R, color: '#FFFFFF', weight: .8, opacity: .5, fill: false, dashArray: '3 5', interactive: false})))
};
let startLL = null;
if (EXTRA.start?.features?.[0]) {
  const c = EXTRA.start.features[0].geometry.coordinates; startLL = ll(c[0], c[1]);
  L.marker(startLL, {icon: L.divIcon({className: '', html: '<div class="start-ic"><i></i><span>START</span></div>', iconSize: [90, 22], iconAnchor: [9, 11]}), keyboard: false, interactive: false, zIndexOffset: 1000}).addTo(map);
}
let routeLayer = null, routeLen = 0, targetsLayer = null;
if (EXTRA.route?.features?.length) {
  routeLayer = L.layerGroup([geo(EXTRA.route, {color: '#FFFFFF', weight: 7, opacity: .9}), geo(EXTRA.route, {color: '#F2561D', weight: 3.5})]);
  routeLen = EXTRA.route.features[0].properties?.length_m || 0;
}
const TG = (EXTRA.targets?.features || []).map(f => ({...f.properties, x: f.geometry.coordinates[0], y: f.geometry.coordinates[1]}));
TG.sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9));
if (TG.length) {

  $('#p-body').innerHTML = `<section class="steps">${steps.map(([c, t, s, tm], i) => `<div class="step ${c}"><span class="ic">${c === 'done' ? IC.ok : i + 1}</span><div><b>${t}</b><small>${s}</small></div><span class="t">${tm}</span></div>`).join('')}</section>
    <section><div class="sec-title"><h2>Fișă tehnică</h2></div><div class="facts">
      <div>Hartă</div><div>Leaflet, CRS.Simple direct în UTM 35N, fără reproiectare</div><div>Imagine</div><div>10 cm/px pe toată zona, 2,5 cm/px pe tile-urile de referință</div>
      <div>Procesare</div><div>1 min 53 s detecție pe 311 tile-uri, MacBook Pro Apple Silicon</div><div>API-uri plătite</div><div>niciunul</div>
      <div>Date</div><div>Sireț3, CC BY 4.0 · OpenAerialMap · OSM (ODbL)</div></div></section>
    <section><div class="sec-title"><h2>Reproducere</h2></div><div class="code" id="repro"><button class="copy" type="button" data-act="copy-repro">Copiază</button><span class="c"># pre-adnotări pe 311 tile-uri</span>
python -m pipeline.baseline --tiles data/tiles --out out/baseline_all.xml
<span class="c"># hartă web: imagini + straturi GeoJSON</span>
python scripts/make_web_tiles.py
python scripts/build_web_map.py
python -m pipeline.to_geojson --cvat data/examples/annotations.xml
<span class="c"># pornește site-ul</span>
python -m http.server -d web 8000</div></section>`;
}
const VIEWS = {harta: viewHarta, traseu: viewTraseu, masuratori: viewMas, pipeline: viewPipe};
function renderPanel() { VIEWS[S.view](); }
function show(v) {
  if (!VIEWS[v]) v = 'harta';
  const wasWide = $('#panel').classList.contains('wide');
  if (S.view !== v) S.q = '';
  S.view = v; $$('.rail a').forEach(a => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#panel').classList.toggle('wide', v === 'masuratori');
  if (S.collapsed) { S.collapsed = false; $('#panel').classList.remove('collapsed'); }
  renderPanel(); $('#p-body').scrollTop = 0;
  if (wasWide !== (v === 'masuratori')) setTimeout(() => map.invalidateSize(), 320);
}
function setSrc(k) { S.src = k; store.set('src', k); for (const [l] of shown) { map.removeLayer(l); } shown.clear(); select(null); refreshAnnotations(); renderPanel(); }

/* ============ layers popover ============ */
function renderLayers() {
  const L1 = [['ortho', 'Ortofoto', 'linear-gradient(135deg,#8A9A5B,#B29873)'], ['canopy', 'Coroane (vineyard)', '#FF3DAA'], ['rows', 'Rânduri + row_id', '#FFD43B'], ['inter', 'Inter-rânduri', '#22D3EE'],
    ['passage', 'Passage (drumuri)', '#FFFFFF'], ['forbidden', 'Forbidden', '#FF4D4D'], ['study', 'Zona de studiu', '#FFFFFF'], ['grid', 'Grilă tile-uri', '#9AA59F']];
  if (routeLayer) L1.push(['route', 'Traseu', '#F2561D']);
  if (targetsLayer) L1.push(['targets', 'Ținte (goluri, deșeuri)', '#2563EB']);
  $('#layers').innerHTML = `<div class="sec-title" style="padding:2px 4px 4px"><h2>Straturi</h2><span><kbd>L</kbd></span></div>` +
    L1.map(([k, l, c]) => `<button type="button" class="sw" role="switch" aria-checked="${!!S.layers[k]}" data-layer="${k}"><span class="sw-i" style="background:${c};border:1px solid var(--line)"></span>${l}<span class="tg"></span></button>`).join('') +
    `<label for="op">Opacitate ortofoto<input type="range" id="op" min="15" max="100" value="${Math.round(S.op * 100)}"></label>
     <p class="note" style="padding:8px 4px 0">La zoom mic, fiecare tile e colorat după câte coroane s-au detectat. Mărește ca să vezi rândurile, apoi inter-rândurile și coroanele. Pe tile-urile de referință imaginea trece la 2,5 cm/px.</p>`;
}

/* ============ palette ============ */
let palItems = [], palIdx = 0;
function palSearch(q) {
  q = q.trim().toLowerCase(); const it = [];
  for (const [v, l, k] of [['harta', 'Hartă', '1'], ['traseu', 'Traseu', '2'], ['masuratori', 'Măsurători', '3'], ['pipeline', 'Pipeline', '4']]) if (!q || l.toLowerCase().includes(q)) it.push({g: 'Secțiuni', k, l, run: () => { location.hash = v; }});
  for (const [k, s] of Object.entries(SRC)) if (!q || s.name.toLowerCase().includes(q)) it.push({g: 'Sursă date', k: '◧', l: s.name, r: s.sub, run: () => setSrc(k)});
  if (!q || 'start'.includes(q)) it.push({g: 'Locuri', k: 'S', l: 'START', r: 'punctul de plecare', run: () => startLL && map.flyTo(startLL, 3)});
  if (q) for (const t of TILES.filter(t => t.name && t.name.includes(q)).slice(0, 12)) { const g = cur().by[t.name]; it.push({g: 'Tile-uri', k: 'T', l: short(t.name), r: g ? `${g.can.length} coroane` : 'fără detecții', run: () => goTile(t.name)}); }
  if (q.length > 1) { const s = cur(); let n = 0; for (const t of s.tiles) for (const f of s.by[t].rows) if (n < 10 && f.properties.row_id.toLowerCase().includes(q)) { n++; it.push({g: 'Rânduri', k: 'R', l: f.properties.row_id, r: fmt(f.properties.length_m, 1) + ' m', run: () => goRow(f.properties.row_id)}); } }
  return it.slice(0, 40);
}
function renderPal() {
  palItems = palSearch($('#pal-in').value); palIdx = Math.min(palIdx, Math.max(0, palItems.length - 1)); let g = '';
  $('#pal-list').innerHTML = palItems.length ? palItems.map((x, i) => (x.g !== g ? `<div class="pal-g">${(g = x.g)}</div>` : '') + `<button type="button" class="pal-i ${i === palIdx ? 'act' : ''}" data-pi="${i}"><span class="k">${x.k}</span>${x.l}<span class="r">${x.r || ''}</span></button>`).join('')
    : `<p class="note" style="padding:16px">Nimic găsit. Încearcă un tile (r021_c012) sau un row_id (V01-R05).</p>`;
  $('#pal-list .act')?.scrollIntoView({block: 'nearest'});
}
const openPal = () => { $('#pal-veil').hidden = false; $('#pal-in').value = ''; palIdx = 0; renderPal(); $('#pal-in').focus(); };
const closePal = () => { $('#pal-veil').hidden = true; };
$('#pal-in').addEventListener('input', () => { palIdx = 0; renderPal(); });
$('#pal-in').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palItems.length - 1, palIdx + 1); renderPal(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palIdx = Math.max(0, palIdx - 1); renderPal(); e.preventDefault(); }
  if (e.key === 'Enter' && palItems[palIdx]) { const x = palItems[palIdx]; closePal(); x.run(); }
});
function goTile(name) { fitBounds(bnds(TB[name]), 4); select({type: 'tile', name}); }
function goRow(id) {
  const s = cur();
  for (const t of s.tiles) { const f = s.by[t].rows.find(r => r.properties.row_id === id); if (f) {
    const L3 = tileLayers(S.src, t); fitBounds(L.latLngBounds(f.geometry.coordinates.map(toLL)).pad(0.3), 4);
    setTimeout(() => { let hit; L3.rows.eachLayer(l => { const a = l.getLatLngs()[0], c = f.geometry.coordinates[0]; if (Math.abs(a.lng - c[0]) < 1e-6 && Math.abs(a.lat - c[1]) < 1e-6) hit = l; }); if (hit) select({type: 'row', p: f.properties, layer: hit}); }, 700);
    return; } }
  toast(`${id} nu e în sursa curentă`);
}

/* ============ export ============ */
function exportData(kind) {
  const s = cur(), u = s.sum;
  if (kind === 'summary') return {name: 'summary.json', note: `Rezumatul calculat din ${s.name.toLowerCase()}.`, text: JSON.stringify({...u, row_lengths: `[${(u.row_lengths || []).length} rânduri]`}, null, 2)};
  if (kind === 'route') return {name: 'route.geojson', note: routeLayer ? 'Traseul calculat.' : 'Traseul nu e calculat încă; mai jos e punctul START de la organizatori.', text: JSON.stringify(EXTRA.route || EXTRA.start, null, 2)};
  const L1 = ['level,vineyard_id,row_id,length_m,canopy_m2,canopy_ha,interrow_m2,interrow_ha',
    `total,,,${u.total_row_length_m},${u.canopy_area_m2},${u.canopy_area_ha},${u.interrow_area_m2},${u.interrow_area_ha}`];
  for (const r of u.row_lengths || []) L1.push(`row,${r.vineyard_id},${r.row_id},${r.length_m},,,,`);
  return {name: 'measurements.csv', note: `${fmt((u.row_lengths || []).length)} rânduri din ${s.name.toLowerCase()}. Versiunea finală se face din exportul Marcaj.`, text: L1.join('\n')};
}
function openExport(kind = 'csv') {
  const d = exportData(kind);
  $('#ex-tabs').innerHTML = [['csv', 'measurements.csv'], ['summary', 'summary.json'], ['route', 'route.geojson']].map(([k, l]) => `<button type="button" data-exk="${k}" aria-pressed="${k === kind}">${l}</button>`).join('');
  $('#ex-title').textContent = d.name; $('#ex-note').textContent = d.note; $('#ex-text').value = d.text;
  $('#ex-veil').hidden = false; $('#ex-veil [data-act="close"]').focus();
}
async function copy(text, el) { try { await navigator.clipboard.writeText(text); toast('Copiat în clipboard'); } catch (e) { if (el) { el.focus(); el.select(); } toast('Textul e selectat. Apasă ⌘C / Ctrl+C'); } }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2400); }
function applyTheme(t) {
  const r = document.documentElement; t === 'light' || t === 'dark' ? r.setAttribute('data-theme', t) : r.removeAttribute('data-theme');
  $('#theme-btn').innerHTML = t === 'light' ? IC.sun : t === 'dark' ? IC.moon : IC.auto;
}

/* ============ events ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-rowid]'); if (!b) return;
  if (b.dataset.pi != null) { const x = palItems[+b.dataset.pi]; closePal(); return x.run(); }
  if (b.dataset.src) return setSrc(b.dataset.src);
  if (b.dataset.layer) { S.layers[b.dataset.layer] = !S.layers[b.dataset.layer]; store.set('layers', S.layers); renderLayers(); return applyLayers(); }
  if (b.dataset.tile) return goTile(b.dataset.tile);
  if (b.dataset.target) { const t = TG.find(x => x.id === b.dataset.target); if (t) { map.flyTo(ll(t.x, t.y), 3.5, {duration: .6}); select({type: 'target', t}); } return; }
  if (b.dataset.rowid) return goRow(b.dataset.rowid);
  if (b.dataset.exk) return openExport(b.dataset.exk);
  switch (b.dataset.act) {
    case 'panel': S.collapsed = !S.collapsed; $('#panel').classList.toggle('collapsed', S.collapsed); return;
    case 'palette': return openPal();
    case 'zin': return map.zoomIn(0.75);
    case 'zout': return map.zoomOut(0.75);
    case 'fit': return fitAll();
    case 'goto-start': return startLL && map.flyTo(startLL, 3.5, {duration: .6});
    case 'layers': { const p = $('#layers'); p.hidden = !p.hidden; b.setAttribute('aria-expanded', !p.hidden); if (!p.hidden) $('#insp').hidden = true; return; }
    case 'theme': { const o = ['auto', 'light', 'dark'], n = o[(o.indexOf(store.get('theme', 'auto')) + 1) % 3]; store.set('theme', n); return applyTheme(n); }
    case 'export': return openExport('csv');
    case 'close': $('#ex-veil').hidden = true; return;
    case 'copy-ex': return copy($('#ex-text').value, $('#ex-text'));
    case 'copy-repro': return copy($('#repro').innerText.replace(/^Copiază\s*/, ''), null);
    case 'unsel': return select(null);
    case 'zoom-tile': return fitBounds(bnds(TB[S.sel.name]), 5);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'op') { S.op = e.target.value / 100; store.set('op', S.op); ortho.eachLayer(l => l.setOpacity(S.op)); hires.eachLayer(l => l.setOpacity(S.op)); }
  if (e.target.id === 'tile-q' || e.target.id === 'row-q') { S.q = e.target.value; const id = e.target.id, pos = e.target.selectionStart; renderPanel(); const n = $('#' + id); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('#pal-veil').hidden ? openPal() : closePal(); }
  if (e.key === 'Escape') { if (!$('#pal-veil').hidden) return closePal(); if (!$('#ex-veil').hidden) return ($('#ex-veil').hidden = true); if (!$('#layers').hidden) return ($('#layers').hidden = true); if (S.sel) return select(null); }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); return openPal(); }
  if ('1234'.includes(e.key) && e.key.length === 1) location.hash = ['harta', 'traseu', 'masuratori', 'pipeline'][+e.key - 1];
  if (e.key.toLowerCase() === 'l') $('.tr [data-act="layers"]').click();
  if (e.key === '0') fitAll();
});
['#pal-veil', '#ex-veil'].forEach(s => $(s).addEventListener('click', e => { if (e.target === $(s)) $(s).hidden = true; }));
addEventListener('hashchange', () => show(location.hash.slice(1)));

/* ============ boot ============ */
applyTheme(store.get('theme', 'auto'));
show(location.hash.slice(1) || 'harta');
map.fitBounds(bnds(EXT), phone() ? {paddingTopLeft: [16, 70], paddingBottomRight: [16, innerHeight * .44 + 100]} : {paddingTopLeft: [leftPad() + 16, 76], paddingBottomRight: [76, 76]});
renderLayers(); applyLayers(); scale();
$('#loader').remove();
})();
</script>
