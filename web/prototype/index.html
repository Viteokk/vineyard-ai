<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Field Planner Sireț3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9ECE8; --panel:rgba(255,255,255,.84); --solid:#FFFFFF; --ink:#101713; --muted:#5A655F; --faint:#8A948E;
  --line:rgba(16,23,19,.10); --hover:rgba(16,23,19,.05); --press:rgba(16,23,19,.09);
  --accent:#1D7A4B; --on-accent:#FFFFFF; --accent-soft:rgba(29,122,75,.12); --accent-ink:#17603B;
  --route:#F2561D; --route-soft:rgba(242,86,29,.14); --target:#2563EB; --waste:#9333EA; --warn:#D92D20; --warn-soft:rgba(217,45,32,.10);
  --shadow:0 1px 1px rgba(16,23,19,.04),0 6px 16px rgba(16,23,19,.08),0 18px 40px rgba(16,23,19,.08);
  --r:16px; --rs:10px;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A0E0C; --panel:rgba(17,22,19,.82); --solid:#131915; --ink:#EDF2EE; --muted:#9BA69F; --faint:#6E7872;
  --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09);
  --accent:#4ADE80; --on-accent:#052312; --accent-soft:rgba(74,222,128,.14); --accent-ink:#86EFAC;
  --route:#FF6B35; --route-soft:rgba(255,107,53,.16); --target:#60A5FA; --waste:#C084FC; --warn:#F97066; --warn-soft:rgba(249,112,102,.14);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35),0 24px 48px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0E0C; --panel:rgba(17,22,19,.82); --solid:#131915; --ink:#EDF2EE; --muted:#9BA69F; --faint:#6E7872;
  --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09);
  --accent:#4ADE80; --on-accent:#052312; --accent-soft:rgba(74,222,128,.14); --accent-ink:#86EFAC;
  --route:#FF6B35; --route-soft:rgba(255,107,53,.16); --target:#60A5FA; --waste:#C084FC; --warn:#F97066; --warn-soft:rgba(249,112,102,.14);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35),0 24px 48px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--hover);color:var(--muted)}

/* ---------- map stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#6F7F4E}
#stage.drag{cursor:grabbing}
#ortho,#vec,#pins{position:absolute;inset:0;width:100%;height:100%}
#pins{pointer-events:none}
#pins > *{pointer-events:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.pin i{display:block;width:14px;height:14px;border-radius:50%;background:var(--target);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.35);transition:transform .2s}
.pin.w i{border-radius:3px;transform:rotate(45deg);background:var(--waste)}
.pin:hover i,.pin.sel i{transform:scale(1.35)}
.pin.w:hover i,.pin.w.sel i{transform:rotate(45deg) scale(1.35)}
.pin.reached i{box-shadow:0 0 0 3px var(--route),0 2px 6px rgba(0,0,0,.35)}
.pin span{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font:600 11px/1 'Geist',sans-serif;color:#fff;background:rgba(10,14,12,.72);padding:4px 7px;border-radius:6px;pointer-events:none}
.pin.pop i{animation:pop .5s ease}
@keyframes pop{50%{transform:scale(1.8)}}
.start{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:flex;align-items:center;gap:6px}
.start i{width:18px;height:18px;border-radius:50%;background:#101713;box-shadow:0 0 0 4px #fff}
.start span{font:700 11px/1 'Geist',sans-serif;letter-spacing:.06em;color:#fff;background:#101713;padding:4px 7px;border-radius:6px}
.blk{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font:700 12px/1 'Geist',sans-serif;letter-spacing:.04em;color:#101713;background:rgba(255,255,255,.9);padding:5px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.walker{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--route);box-shadow:0 0 0 4px #fff,0 0 0 10px rgba(242,86,29,.28);pointer-events:none}

/* ---------- chrome ---------- */
.rail{position:fixed;left:16px;top:16px;bottom:16px;width:60px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:5}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:8px}
.rail a{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);text-decoration:none}
.rail a:hover{background:var(--hover);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.rail a .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s}
.rail a:hover .tip,.rail a:focus-visible .tip{opacity:1}
.rail .sp{flex-grow:1}
.rail button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.rail button:hover{background:var(--hover);color:var(--ink)}

.panel{position:fixed;left:88px;top:16px;bottom:16px;width:380px;border-radius:20px;z-index:4;display:flex;flex-direction:column;overflow:hidden;transition:width .28s cubic-bezier(.2,.8,.2,1),transform .28s cubic-bezier(.2,.8,.2,1)}
.panel.wide{width:min(760px,calc(100vw - 120px))}
.panel.collapsed{transform:translateX(calc(-100% - 100px))}
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.p-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.p-head h1{font-size:20px;margin-top:3px}
.p-body{flex-grow:1;overflow:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:22px}
.p-body::-webkit-scrollbar{width:10px}.p-body::-webkit-scrollbar-thumb{background:var(--press);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-title h2{font-size:13px;font-weight:600}
.sec-title span{font-size:12px;color:var(--muted)}

.seg{display:flex;padding:3px;border-radius:12px;background:var(--hover);gap:2px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);padding:0 10px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(n+3){border-top:1px solid var(--line)}
.stat .v{font-size:20px;font-weight:600;letter-spacing:-.02em}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.stat .l{font-size:12px;color:var(--muted)}
.stat.hero{grid-column:1/-1;border-right:0!important;flex-direction:row;align-items:center;justify-content:space-between}
.stat.hero .v{font-size:32px;color:var(--route)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 8px;margin:0 -8px;border-radius:10px;text-align:left;width:calc(100% + 16px)}
.li:hover{background:var(--hover)}
.li.sel{background:var(--accent-soft)}
.li b{font-weight:600}
.li .r{margin-left:auto;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--accent)}
.dot.dis{background:var(--warn)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.badge.dis{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--solid);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.block{width:100%}

/* timeline of targets */
.tl{position:relative;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:var(--line)}
.tl-i{position:relative;display:flex;align-items:center;gap:12px;padding:8px;margin:0 -8px;border-radius:12px;cursor:pointer}
.tl-i:hover{background:var(--hover)}
.tl-i.sel{background:var(--accent-soft)}
.tl-n{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--solid);border:2px solid var(--target);color:var(--ink);flex-shrink:0}
.tl-n.w{border-color:var(--waste);border-radius:9px}
.tl-i.reached .tl-n{background:var(--route);border-color:var(--route);color:#fff}
.tl-t{flex-grow:1;min-width:0}
.tl-t b{font-weight:600}
.tl-t div{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbx{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.checks{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;align-items:center;gap:10px;min-height:36px;font-size:13px}
.ck svg{color:var(--accent);flex-shrink:0}
.ck .r{margin-left:auto;font-weight:600}
.progress{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* measurements */
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;top:0;background:var(--solid)}
td{padding:9px 10px;border-top:1px solid var(--line);font-size:13px;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.th-btn{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:4px}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:340px;background:var(--solid)}
.bars{display:flex;height:8px;border-radius:4px;overflow:hidden;width:120px}
.search{width:100%;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--solid);padding:0 12px}
.chart text{font-family:'Geist',sans-serif;font-size:11px;fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-weight:600}
.chart .val{fill:var(--ink)}
.chart .grid{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* pipeline */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:14px;top:40px;bottom:-6px;width:2px;background:var(--line)}
.step .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--line);background:var(--solid);color:var(--muted)}
.step.done .ic{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.wip .ic{border-color:var(--route);color:var(--route)}
.step b{display:block;font-weight:600}
.step small{color:var(--muted);font-size:12px}
.step .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:6px}
.code{position:relative;background:#0B100D;color:#D4E2D8;border-radius:14px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.75;white-space:pre;overflow-x:auto}
.code .c{color:#6D8575}
.code .copy{position:absolute;right:8px;top:8px;height:28px;padding:0 10px;border-radius:8px;border:1px solid #243129;background:#131B16;color:#D4E2D8;font-size:12px;font-weight:600}
.facts{display:grid;grid-template-columns:130px 1fr;font-size:13px}
.facts div{padding:9px 0;border-top:1px solid var(--line)}
.facts div:nth-child(odd){color:var(--muted)}

/* top bar, inspector, player, zoom */
.cmd{position:fixed;left:50%;top:16px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));height:44px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;z-index:6;color:var(--muted);text-align:left}
.cmd:hover{color:var(--ink)}
.cmd .grow{flex-grow:1}
.panel:not(.collapsed) ~ .cmd{left:calc(50% + 234px)}
.panel.wide:not(.collapsed) ~ .cmd{left:calc(50% + 380px + 44px);width:min(360px,calc(100vw - 900px))}
.tr{position:fixed;right:16px;top:16px;display:flex;gap:8px;z-index:6}
.tr .icon-btn{width:44px;height:44px;border-radius:14px}
.tr .btn{min-height:44px;border-radius:14px}
.pop{position:fixed;right:16px;top:70px;width:280px;border-radius:18px;padding:14px;z-index:7;display:flex;flex-direction:column;gap:4px}
.sw{display:flex;align-items:center;gap:10px;min-height:38px;font-size:13px;padding:0 4px;border-radius:10px;width:100%;text-align:left}
.sw:hover{background:var(--hover)}
.sw .sw-i{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.sw .tg{margin-left:auto;width:32px;height:20px;border-radius:999px;background:var(--press);position:relative;transition:background .15s;flex-shrink:0}
.sw .tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"] .tg{background:var(--accent)}
.sw[aria-checked="true"] .tg::after{transform:translateX(12px)}
.pop label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding:8px 4px 2px;border-top:1px solid var(--line);margin-top:6px}
input[type=range]{accent-color:var(--accent);width:100%}
.insp{position:fixed;right:16px;top:70px;width:300px;border-radius:18px;padding:16px;z-index:6;display:flex;flex-direction:column;gap:12px}
.insp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.insp dt{color:var(--muted)}
.insp dd{margin:0;font-weight:600;text-align:right}
.insp .acts{display:flex;gap:8px}
.insp .acts .btn{flex:1;min-height:36px;font-size:13px;padding:0 10px}
.player{position:fixed;left:calc(50% + 234px);bottom:16px;transform:translateX(-50%);width:min(560px,calc(100vw - 560px));min-width:380px;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:5}
.panel.collapsed ~ .player{left:50%}
.panel.wide:not(.collapsed) ~ .player{display:none}
.play{width:40px;height:40px;border-radius:12px;background:var(--route);color:#fff;display:grid;place-items:center;flex-shrink:0}
.player .mid{flex-grow:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.player .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.player .row b{color:var(--ink);font-weight:600}
.player input{accent-color:var(--route)}
.zoom{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;border-radius:14px;z-index:5;overflow:hidden}
.zoom button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.zoom button:hover{background:var(--hover)}
.zoom button+button{border-top:1px solid var(--line)}
.readout{position:fixed;right:16px;bottom:166px;height:44px;border-radius:14px;display:flex;align-items:center;gap:14px;padding:0 14px;z-index:5;font-size:12px;color:var(--muted)}
.readout .sb{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.readout .sb i{display:block;height:4px;background:var(--ink);border-radius:2px}

/* command palette + modal + toast */
.veil{position:fixed;inset:0;z-index:20;background:rgba(6,10,8,.35);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.palette{width:min(600px,100%);border-radius:20px;overflow:hidden;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.palette input{width:100%;height:56px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 20px;font-size:16px;outline:none}
.pal-list{max-height:360px;overflow:auto;padding:8px}
.pal-g{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.pal-i{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:10px;text-align:left}
.pal-i .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--hover);color:var(--muted);font-size:11px;font-weight:700;flex-shrink:0}
.pal-i .r{margin-left:auto;font-size:12px;color:var(--muted)}
.pal-i.act{background:var(--accent-soft)}
.pal-foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.modal{width:min(720px,100%);border-radius:20px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:80vh}
.modal textarea{width:100%;flex-grow:1;min-height:300px;border-radius:12px;border:1px solid var(--line);background:var(--hover);font-family:var(--mono);font-size:12px;padding:12px;resize:vertical}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

/* ---------- phone ---------- */
@media (max-width:820px){
  .rail{left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;height:60px;flex-direction:row;justify-content:space-around;padding:0 8px}
  .rail .logo,.rail .sp,.rail a .tip{display:none}
  .panel,.panel.wide{left:12px;right:12px;width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:46vh}
  .panel.collapsed{transform:translateY(calc(100% - 64px))}
  .cmd,.panel:not(.collapsed) ~ .cmd,.panel.wide:not(.collapsed) ~ .cmd{left:12px;right:72px;width:auto;transform:none;top:12px}
  .tr{right:12px;top:12px}.tr .btn,.tr [data-act="theme"]{display:none}
  .pop,.insp{right:12px;left:12px;width:auto;top:66px}
  .player,.zoom,.readout{display:none!important}
  .panel.wide .p-body{padding-bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    <section><div class="sec-title"><h2>Lungimea rândurilor pe bloc</h2><span>metri</span></div>
      <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${bw} ${ch}" width="100%" style="min-width:520px" role="img" aria-label="Lungimea totală a rândurilor pe fiecare bloc">
        ${ticks.map(t => `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${top}" y2="${ch - 18}"/><text x="${sx(t)}" y="${ch - 4}" text-anchor="middle">${fmt(t)}</text>`).join('')}
        ${BLK.map((x, i) => { const y = top + i * rowH; return `<text class="lbl" x="0" y="${y + 15}">${x.b}</text><rect x="${lab}" y="${y + 5}" width="${sx(x.len) - lab}" height="13" rx="3" fill="var(--accent)" opacity="${x.b in MAPBLK ? 1 : .55}"/><text class="val num" x="${sx(x.len) + 6}" y="${y + 15}">${fmt(x.len)}</text>`; }).join('')}
      </svg></div></section>
    <section><div class="sec-title"><h2>Pe blocuri</h2><div class="legend"><span><i style="background:#C8B48C"></i>bare_soil</span><span><i style="background:#8DB07A"></i>mixed</span><span><i style="background:#3F7A4A"></i>vegetation</span></div></div>
      <div class="tbl"><table><thead><tr>${th('b', 'Bloc')}${th('rows', 'Rânduri')}${th('len', 'Lungime')}${th('canopy', 'Coroane m²')}${th('inter', 'Inter-rânduri m²')}${th('dis', 'Disrupted')}<th>Acoperire</th></tr></thead>
      <tbody>${list.map(x => `<tr data-blkrow="${x.b}"><td><b>${x.b}</b></td><td class="num">${x.rows}</td><td class="num">${fmt(x.len)} m</td><td class="num">${fmt(x.canopy)}</td><td class="num">${fmt(x.inter)}</td><td class="num" style="${x.dis ? 'color:var(--warn);font-weight:600' : ''}">${x.dis}</td><td><div class="bars" title="bare_soil ${x.cover[0]}%, mixed ${x.cover[1]}%, vegetation ${x.cover[2]}%"><span style="width:${x.cover[0]}%;background:#C8B48C"></span><span style="width:${x.cover[1]}%;background:#8DB07A"></span><span style="width:${x.cover[2]}%;background:#3F7A4A"></span></div></td></tr>`).join('')}</tbody></table></div></section>
    <section><div class="sec-title"><h2>Rânduri</h2><span class="num">${rows.length} găsite</span></div>
      <input class="search" id="row-q" type="search" placeholder="Filtrează după row_id, ex. V05 sau V09-R3" value="${S.q.replace(/"/g, '')}" aria-label="Filtrează rânduri">
      <div class="tbl" style="margin-top:8px;max-height:300px"><table><thead><tr><th>row_id</th><th>vineyard_id</th><th>Lungime</th><th>row_structure</th></tr></thead>
      <tbody>${shown.map(r => `<tr data-rowjump="${r.id}"><td><b>${r.id}</b></td><td>${r.b}</td><td class="num">${fmt(r.len, 1)} m</td><td><span class="badge ${r.dis ? 'dis' : ''}">${r.dis ? 'disrupted' : 'regular'}</span></td></tr>`).join('')}</tbody></table></div>
      ${rows.length > 60 ? `<p class="muted" style="font-size:12px;margin:8px 0 0">Primele 60 din ${rows.length}. Filtrează ca să restrângi.</p>` : ''}</section>
    <p class="muted" style="font-size:12px;margin:0">Arii orizontale în EPSG:32635. Arie coroane = reuniunea poligoanelor; lungimea unui rând = suma segmentelor lui din toate tile-urile. Date ilustrative în prototip.</p>`;
}
function viewPipe() {
  const steps = [['done', 'Tile-uri', '311 GeoTIFF · 2,5 cm/px', '—'], ['done', 'Detector CV clasic', 'scor local 0,817 pe referință', '1:53'],
    ['todo', 'ID-uri globale', 'vineyard_id / row_id peste tile-uri', '—'], ['todo', 'Export CVAT', '5 ZIP-uri < 90 MB', '—'],
    ['wip', 'Corectură în Marcaj', 'toată echipa, sâmbătă–duminică', 'manual'], ['todo', 'Traseu + măsurători', 'route.geojson · measurements.csv', '—']];
  $('#p-head').innerHTML = head('Pipeline & reproducere', 'De la dronă la traseu');
  $('#p-body').innerHTML = `
    <section class="steps">${steps.map(([c, t, s, tm], i) => `<div class="step ${c}"><span class="ic">${c === 'done' ? IC.ok : i + 1}</span><div><b>${t}</b><small>${s}</small></div><span class="t">${tm}</span></div>`).join('')}</section>
    <section><div class="sec-title"><h2>Fișă tehnică</h2></div><div class="facts">
      <div>Procesare</div><div>1 min 53 s pentru 311 tile-uri, MacBook Pro Apple Silicon</div>
      <div>Scor local</div><div>0,817 cu formula oficială (<span class="mono">pipeline/eval.py</span>)</div>
      <div>Model neural</div><div>YOLO-seg pe pseudo-etichete, planificat</div>
      <div>API-uri plătite</div><div>niciunul</div>
      <div>Date</div><div>Sireț3, CC BY 4.0 · OpenAerialMap · OSM (ODbL)</div></div></section>
    <section><div class="sec-title"><h2>Reproducere</h2></div>
      <div class="code" id="repro"><button class="copy" type="button" data-act="copy-repro">Copiază</button><span class="c"># instalare</span>
pip install -r requirements.lock.txt
python scripts/setup_data.py
<span class="c"># pre-adnotări pe 311 tile-uri</span>
python -m pipeline.baseline --tiles data/tiles \\
    --out out/baseline_all.xml
<span class="c"># scor local</span>
python -m pipeline.eval --pred out/baseline.xml</div></section>`;
}
const VIEWS = {harta: viewHarta, traseu: viewTraseu, masuratori: viewMas, pipeline: viewPipe};
function renderPanel() { VIEWS[S.view](); syncLists(); renderPlayer(); }
function show(v) {
  if (!VIEWS[v]) v = 'harta';
  const wasWide = $('#panel').classList.contains('wide');
  S.view = v; $$('.rail a').forEach(a => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#panel').classList.toggle('wide', v === 'masuratori');
  if (S.collapsed) setCollapsed(false, false);
  renderPanel(); $('#p-body').scrollTop = 0;
  if (wasWide !== (v === 'masuratori')) setTimeout(() => fit(), 30);
}
function setCollapsed(c, refit = true) { S.collapsed = c; $('#panel').classList.toggle('collapsed', c); if (refit) setTimeout(() => fit(), 30); }

/* =============== player =============== */
let raf = 0, last = 0;
function renderPlayer() {
  const tg = modeTargets(), reached = tg.filter(t => S.pos >= t.s - 1).length;
  $('#play-btn').innerHTML = S.playing ? IC.pause : IC.play;
  $('#play-btn').setAttribute('aria-label', S.playing ? 'Pauză' : 'Simulează turul');
  $('#pl-a').innerHTML = `<b>${reached} / ${tg.length}</b> ținte atinse`;
  $('#pl-b').innerHTML = `<b class="num">${kmT(S.pos * SCALE)}</b> din ${kmT(R.total * SCALE)}`;
  $('#scrub').value = Math.round(S.pos / R.total * 1000);
}
function setPos(p) {
  const before = new Set(modeTargets().filter(t => S.pos >= t.s - 1).map(t => t.id));
  S.pos = Math.max(0, Math.min(R.total, p)); render();
  const now = modeTargets().filter(t => S.pos >= t.s - 1);
  for (const t of now) if (!before.has(t.id)) { const el = pins.querySelector(`[data-pin="${t.id}"]`); el?.classList.add('pop'); }
  renderPlayer();
  if (S.view === 'traseu') $$('.tl-i').forEach(el => { const t = now.find(x => x.id === el.dataset.target); el.classList.toggle('reached', !!t); });
}
function play(on = !S.playing) {
  if (on && S.pos >= R.total) S.pos = 0;
  S.playing = on; cancelAnimationFrame(raf);
  if (on) {
    if (reduce) { setPos(R.total); S.playing = false; renderPanel(); return; }
    last = performance.now();
    const speed = R.total / 14;   // whole tour in ~14 s
    const tick = t => { setPos(S.pos + (t - last) / 1000 * speed); last = t; if (S.pos >= R.total) { S.playing = false; renderPanel(); toast('Tur complet · înapoi la START'); return; } raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }
  if (S.view === 'traseu') viewTraseu(); renderPlayer();
}
function jump(dir) {
  const tg = modeTargets(); play(false);
  const t = dir > 0 ? tg.find(x => x.s > S.pos + 1) : [...tg].reverse().find(x => x.s < S.pos - 1);
  if (t) { setPos(t.s); select({type: 'target', id: t.id}, true); } else setPos(dir > 0 ? R.total : 0);
}
$('#scrub').addEventListener('input', e => { play(false); setPos(e.target.value / 1000 * R.total); });

/* =============== layers popover =============== */
function renderLayers() {
  const L = [['ortho', 'Ortofoto', 'linear-gradient(135deg,#8A9A5B,#B29873)'], ['canopy', 'Coroane (vineyard)', '#FF3DAA'], ['inter', 'Inter-rânduri', '#22D3EE'], ['rows', 'Rânduri + row_id', '#FFD43B'],
             ['passage', 'Passage / forbidden', '#D92D20'], ['targets', 'Ținte inspecție', 'var(--target)'], ['waste', 'Deșeuri', 'var(--waste)'], ['route', 'Traseu', 'var(--route)']];
  $('#layers').innerHTML = `<div class="sec-title" style="padding:2px 4px 4px"><h2>Straturi</h2><span><kbd>L</kbd></span></div>` +
    L.map(([k, l, c]) => `<button type="button" class="sw" role="switch" aria-checked="${!!S.layers[k]}" data-layer="${k}"><span class="sw-i" style="background:${c}"></span>${l}<span class="tg"></span></button>`).join('') +
    `<label for="op">Opacitate ortofoto <input type="range" id="op" min="20" max="100" value="${Math.round(S.orthoOp * 100)}"></label>`;
}

/* =============== command palette =============== */
let palItems = [], palIdx = 0;
function palSearch(q) {
  q = q.trim().toLowerCase();
  const items = [];
  const sec = [['harta', 'Hartă', '1'], ['traseu', 'Traseu', '2'], ['masuratori', 'Măsurători', '3'], ['pipeline', 'Pipeline', '4']];
  for (const [v, l, k] of sec) if (!q || l.toLowerCase().includes(q)) items.push({g: 'Secțiuni', k, l, r: '', run: () => { location.hash = v; }});
  for (const m of Object.keys(MODES)) if (!q || ('traseu ' + m).toLowerCase().includes(q)) items.push({g: 'Acțiuni', k: '↻', l: `Traseu ${m.toLowerCase()}`, r: 'mod', run: () => { setMode(m); location.hash = 'traseu'; }});
  if (!q || 'simuleaza turul'.includes(q)) items.push({g: 'Acțiuni', k: '▶', l: 'Simulează turul', r: 'spațiu', run: () => play(true)});
  if (!q || 'export route csv'.includes(q)) items.push({g: 'Acțiuni', k: '↓', l: 'Export route.geojson / measurements.csv', r: '', run: () => openExport('route')});
  for (const t of TARGETS) if (!q || (t.id + ' ' + t.what).toLowerCase().includes(q)) items.push({g: 'Ținte', k: t.kind === 't' ? 'T' : 'W', l: `${t.id} · ${t.what}`, r: t.row || t.b, run: () => { if (S.view !== 'traseu' && S.view !== 'harta') location.hash = 'harta'; select({type: 'target', id: t.id}, true); }});
  for (const b of BLK) if (q && b.b.toLowerCase().includes(q)) items.push({g: 'Blocuri', k: 'B', l: `${b.b} · ${b.rows} rânduri`, r: kmT(b.len), run: () => { if (b.b in MAPBLK) { S.block = b.b; location.hash = 'harta'; renderPanel(); render(); fit(); } else { S.q = b.b; location.hash = 'masuratori'; renderPanel(); } }});
  if (q) for (const r of ROWS.filter(r => r.id.toLowerCase().includes(q)).slice(0, 12)) items.push({g: 'Rânduri', k: 'R', l: r.id, r: `${fmt(r.len, 1)} m${r.dis ? ' · disrupted' : ''}`, run: () => rowJump(r.id)});
  return items.slice(0, 40);
}
function renderPal() {
  palItems = palSearch($('#pal-in').value); palIdx = Math.min(palIdx, Math.max(0, palItems.length - 1));
  let g = ''; $('#pal-list').innerHTML = palItems.length ? palItems.map((it, i) => { const h = it.g !== g ? `<div class="pal-g">${(g = it.g)}</div>` : ''; return h + `<button type="button" class="pal-i ${i === palIdx ? 'act' : ''}" role="option" aria-selected="${i === palIdx}" data-pi="${i}"><span class="k">${it.k}</span>${it.l}<span class="r">${it.r}</span></button>`; }).join('')
    : `<p class="muted" style="padding:16px;margin:0">Nimic găsit pentru „${$('#pal-in').value}”. Încearcă un row_id (V05-R12) sau un ID de țintă (T002).</p>`;
  $('#pal-list').querySelector('.act')?.scrollIntoView({block: 'nearest'});
}
function openPal() { $('#pal-veil').hidden = false; $('#pal-in').value = ''; palIdx = 0; renderPal(); $('#pal-in').focus(); }
function closePal() { $('#pal-veil').hidden = true; }
$('#pal-in').addEventListener('input', () => { palIdx = 0; renderPal(); });
$('#pal-in').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palItems.length - 1, palIdx + 1); renderPal(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palIdx = Math.max(0, palIdx - 1); renderPal(); e.preventDefault(); }
  if (e.key === 'Enter' && palItems[palIdx]) { const it = palItems[palIdx]; closePal(); it.run(); }
});
function rowJump(id) {
  const r = ROWS.find(x => x.id === id);
  if (r.b in MAPBLK) { if (S.view !== 'harta') location.hash = 'harta'; S.block = r.b; renderPanel(); select({type: 'row', id}, true); }
  else { S.q = id; if (S.view !== 'masuratori') location.hash = 'masuratori'; else renderPanel(); toast(`${id} e în afara fragmentului de hartă din prototip`); }
}

/* =============== export =============== */
function exportData(kind) {
  const crs = {type: 'name', properties: {name: 'urn:ogc:def:crs:EPSG::32635'}};
  if (kind === 'route') return {name: 'route.geojson', note: `Un LineString, mod ${S.mode.toLowerCase()}, ${fmt(Math.round(R.total * SCALE))} m, start = finish.`,
    text: JSON.stringify({type: 'FeatureCollection', crs, features: [{type: 'Feature', properties: {length_m: Math.round(R.total * SCALE), mode: S.mode}, geometry: {type: 'LineString', coordinates: R.pts.map(([u, v]) => utm(u, v).map(x => +x.toFixed(2)))}}]}, null, 2)};
  if (kind === 'targets') return {name: 'targets.geojson', note: 'Punctele de inspecție și deșeurile, în ordinea turului.',
    text: JSON.stringify({type: 'FeatureCollection', crs, features: modeTargets().map((t, i) => ({type: 'Feature', properties: {order: i + 1, id: t.id, type: t.what, vineyard_id: t.b, row_id: t.row || null}, geometry: {type: 'Point', coordinates: utm(t.u, t.v).map(x => +x.toFixed(2))}}))}, null, 2)};
  const L = ['level,vineyard_id,row_id,rows,length_m,canopy_m2,canopy_ha,interrow_m2,interrow_ha', `total,,,${TOT.rows},${TOT.len.toFixed(1)},${TOT.canopy.toFixed(1)},${(TOT.canopy / 1e4).toFixed(4)},${TOT.inter.toFixed(1)},${(TOT.inter / 1e4).toFixed(4)}`];
  for (const x of BLK) L.push(`block,${x.b},,${x.rows},${x.len.toFixed(1)},${x.canopy.toFixed(1)},${(x.canopy / 1e4).toFixed(4)},${x.inter.toFixed(1)},${(x.inter / 1e4).toFixed(4)}`);
  for (const r of ROWS) L.push(`row,${r.b},${r.id},1,${r.len.toFixed(1)},,,,`);
  return {name: 'measurements.csv', note: `${BLK.length} blocuri și ${ROWS.length} rânduri, o linie pe bloc și una pe rând.`, text: L.join('\n')};
}
function openExport(kind) {
  const d = exportData(kind);
  $('#ex-tabs').innerHTML = [['route', 'route.geojson'], ['targets', 'targets.geojson'], ['csv', 'measurements.csv']].map(([k, l]) => `<button type="button" data-exk="${k}" aria-pressed="${k === kind}">${l}</button>`).join('');
  $('#ex-title').textContent = d.name; $('#ex-note').textContent = d.note + ' Copiază conținutul în fișier.'; $('#ex-text').value = d.text;
  $('#ex-veil').hidden = false; $('#ex-veil [data-act="close"]').focus();
}
async function copy(text, el) {
  try { await navigator.clipboard.writeText(text); toast('Copiat în clipboard'); }
  catch (e) { if (el) { el.focus(); el.select(); } toast('Textul e selectat. Apasă ⌘C / Ctrl+C'); }
}
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

/* =============== theme =============== */
function applyTheme(t) {
  const r = document.documentElement; t === 'light' || t === 'dark' ? r.setAttribute('data-theme', t) : r.removeAttribute('data-theme');
  $('#theme-btn').innerHTML = t === 'light' ? IC.sun : t === 'dark' ? IC.moon : IC.auto;
  $('#theme-btn').setAttribute('aria-label', `Temă: ${t === 'light' ? 'luminoasă' : t === 'dark' ? 'întunecată' : 'ca sistemul'}. Schimbă tema`);
}
function setMode(m) { S.mode = m; store.set('mode', m); R = parsePath(MODES[m].d); play(false); S.pos = 0; updateRoute(); render(); renderPanel(); }

/* =============== events =============== */
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-target],[data-blkrow],[data-rowjump]'); if (!b) return;
  const a = b.dataset.act;
  if (b.dataset.pi != null) { const it = palItems[+b.dataset.pi]; closePal(); it.run(); return; }
  if (b.dataset.mode) return setMode(b.dataset.mode);
  if (b.dataset.block) { S.block = b.dataset.block; store.set('block', S.block); renderPanel(); render(); if (S.block !== 'ALL') focusOn(S.block === 'V01' ? 340 : 752, 340, 1.6); else fit(); return; }
  if (b.dataset.layer) { S.layers[b.dataset.layer] = !S.layers[b.dataset.layer]; store.set('layers', S.layers); renderLayers(); render(); return; }
  if (b.dataset.row && b.classList.contains('li')) return select({type: 'row', id: b.dataset.row}, true);
  if (b.dataset.target && !e.target.closest('input')) { const t = modeTargets().find(x => x.id === b.dataset.target); play(false); setPos(t.s); return select({type: 'target', id: t.id}, true); }
  if (b.dataset.sort) { const k = b.dataset.sort; S.sort = {k, d: S.sort.k === k ? -S.sort.d : 1}; return viewMas(); }
  if (b.dataset.blkrow) { S.q = b.dataset.blkrow; viewMas(); $('#row-q')?.scrollIntoView({block: 'center', behavior: reduce ? 'auto' : 'smooth'}); return; }
  if (b.dataset.rowjump) return rowJump(b.dataset.rowjump);
  if (b.dataset.exk) return openExport(b.dataset.exk);
  switch (a) {
    case 'panel': return setCollapsed(!S.collapsed);
    case 'palette': return openPal();
    case 'play': return play();
    case 'prev': return jump(-1);
    case 'next': return jump(1);
    case 'zin': return animateTo(V.cx, V.cy, Math.min(14, V.k * 1.6));
    case 'zout': return animateTo(V.cx, V.cy, Math.max(.35, V.k / 1.6));
    case 'fit': return fit();
    case 'layers': { const p = $('#layers'); p.hidden = !p.hidden; b.setAttribute('aria-expanded', !p.hidden); if (!p.hidden) $('#insp').hidden = true; return; }
    case 'theme': { const o = ['auto', 'light', 'dark'], n = o[(o.indexOf(store.get('theme', 'auto')) + 1) % 3]; store.set('theme', n); return applyTheme(n); }
    case 'export': return openExport(b.dataset.kind || 'route');
    case 'close': $('#ex-veil').hidden = true; return;
    case 'copy-ex': return copy($('#ex-text').value, $('#ex-text'));
    case 'copy-repro': return copy($('#repro').innerText.replace(/^Copiază\s*/, ''), null);
    case 'unsel': return select(null);
    case 'center': { if (S.sel.type === 'row') { const r = ROWS.find(x => x.id === S.sel.id); focusOn(MAPBLK[r.b][r.k], 340, 2.2); } else { const t = TARGETS.find(x => x.id === S.sel.id); focusOn(t.u, t.v, 3); } return; }
    case 'show-rows': { S.q = S.sel.id; location.hash = 'masuratori'; return; }
    case 'visit': { S.visited[b.dataset.id] = !S.visited[b.dataset.id]; store.set('visited', S.visited); S.sel = null; select({type: 'target', id: b.dataset.id}); if (S.view === 'traseu') viewTraseu(); syncLists(); if (S.visited[b.dataset.id]) toast(`${b.dataset.id} marcat vizitat`); return; }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.visit) { S.visited[e.target.dataset.visit] = e.target.checked; store.set('visited', S.visited); viewTraseu(); syncLists(); if (e.target.checked) toast(`${e.target.dataset.visit} marcat vizitat`); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'op') { S.orthoOp = e.target.value / 100; store.set('orthoOp', S.orthoOp); render(); }
  if (e.target.id === 'row-q') { S.q = e.target.value; const pos = e.target.selectionStart; viewMas(); const n = $('#row-q'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('#pal-veil').hidden ? openPal() : closePal(); }
  if (e.key === 'Escape') { if (!$('#pal-veil').hidden) return closePal(); if (!$('#ex-veil').hidden) return ($('#ex-veil').hidden = true); if (!$('#layers').hidden) return ($('#layers').hidden = true); if (S.sel) return select(null); }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); return openPal(); }
  if ('1234'.includes(e.key) && e.key.length === 1) { location.hash = ['harta', 'traseu', 'masuratori', 'pipeline'][+e.key - 1]; return; }
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); return play(); }
  if (e.key === ']') return jump(1);
  if (e.key === '[') return jump(-1);
  if (e.key.toLowerCase() === 'l') return $('.tr [data-act="layers"]').click();
  if (e.key === '+' || e.key === '=') return animateTo(V.cx, V.cy, Math.min(14, V.k * 1.6));
  if (e.key === '-') return animateTo(V.cx, V.cy, Math.max(.35, V.k / 1.6));
  if (e.key === '0') return fit();
});
['#pal-veil', '#ex-veil'].forEach(s => $(s).addEventListener('click', e => { if (e.target === $(s)) $(s).hidden = true; }));
addEventListener('hashchange', () => show(location.hash.slice(1)));
addEventListener('resize', () => { resize(); });

/* =============== boot =============== */
applyTheme(store.get('theme', 'auto'));
buildVec(); updateRoute(); renderLayers();
show(location.hash.slice(1) || 'harta');
resize(); fit(false);
