<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intrare Field Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Geist:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--ink:#FFFFFF;--muted:#9FAAA3;--blue:#0046AE;--yellow:#FFD200;--red:#CC092F}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;background:#1B221E url('data/hires/siret3_r021_c012.webp') center/cover fixed;color:var(--ink);font:16px/1.5 'Geist',system-ui,sans-serif;display:flex;flex-direction:column;padding-inline:20px}
body::before{content:'';position:fixed;inset:0;background:rgba(10,14,12,.82);z-index:0}
body > *{position:relative;z-index:1}
header{padding-block:22px;display:flex;justify-content:space-between;align-items:center;max-width:1100px;width:100%;margin:0 auto}
a{color:inherit}
.logo{font-weight:700;font-size:18px;text-decoration:none}
header a.back{color:var(--muted);font-size:14px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:24px 56px}
.ribbon{display:flex;width:120px;height:6px}.ribbon i{flex:1}.ribbon i:nth-child(1){background:var(--blue)}.ribbon i:nth-child(2){background:var(--yellow)}.ribbon i:nth-child(3){background:var(--red)}
h1{font:800 clamp(38px,6vw,56px)/1.05 'Bricolage Grotesque','Geist',sans-serif;margin:0;letter-spacing:-.02em;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:20px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:260px;padding:30px 28px 28px;border-radius:22px;background:var(--c);color:#fff;text-decoration:none;border:0;cursor:pointer;text-align:left;font:inherit;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.tile:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.tile.insp{--c:var(--blue)}.tile.admin{--c:var(--red)}
.tile b{display:block;font:800 30px/1.1 'Bricolage Grotesque','Geist',sans-serif}
.tile span.sub{display:block;margin-top:6px;font-weight:500}
.note{color:var(--muted);font-size:14px;margin:0;text-align:center}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;width:min(620px,100%)}.or::before,.or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.16)}
.mpass{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:14px;background:#fff;color:#0B0F0D;font:700 16px 'Geist',sans-serif;text-decoration:none}
.mpass:hover{background:#E9EFE9}.mpass:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
@media (max-width:640px){.tiles{grid-template-columns:1fr;width:100%;max-width:340px}.tile{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:20px;padding:22px}.tile svg{flex-shrink:0}.tile b{font-size:26px}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">Field Planner</a><a class="back" href="index.html">Înapoi</a></header>
<main>
  <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>Cine intră?</h1>
  <div class="tiles">
    <button class="tile insp" type="button" data-role="inspector">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <span><b>Inspector</b><span class="sub">Control și conformitate →</span></span>
    </button>
    <button class="tile admin" type="button" data-role="fermier">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="10" r="2.4"/><circle cx="15" cy="10" r="2.4"/><circle cx="12" cy="14.5" r="2.4"/><circle cx="9" cy="18.5" r="2.2"/><circle cx="15" cy="18.5" r="2.2"/><path d="M12 7.5V4M12 4c2-1.5 4-1 5 0"/></svg>
      <span><b>Administrator</b><span class="sub">Vie, costuri, trasee →</span></span>
    </button>
  </div>
  <div class="or">sau</div>
  <a class="mpass" href="mpass.html?return=app.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Intră cu MPass</a>
  <p class="note">Demo: MPass e simulat. Plăcile de mai sus intră direct, fără parolă.</p>
</main>
<script>
document.querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => {
  const role = b.dataset.role;
  try {
    const prev = JSON.parse(localStorage.getItem('fpm.session') || 'null') || {};
    localStorage.setItem('fpm.session', JSON.stringify({...prev, role, at: new Date().toISOString()}));
    localStorage.setItem('fpm.role', JSON.stringify(role));
  } catch (e) {}
  location.href = 'app.html#' + role;
}));
if (/administrator|fermier/.test(location.hash)) document.querySelector('.tile.admin').focus();
</script>
</body>
</html>
